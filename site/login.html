<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Month Recap · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { --bg:#f4f6f8; --card:#ffffff; --ink:#15212b; --muted:#5a6773; --rule:#d8dee4; --accent:#0d6b4f; --accent-ink:#ffffff; --warn:#9a3a1f;
  --font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#10161b; --card:#182128; --ink:#e4e9ed; --muted:#9aa7b1; --rule:#2b3640; --accent:#4fbf95; --accent-ink:#0b1712; --warn:#f0a080; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font); padding:16px; }
main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:28px; display:grid; gap:16px; }
h1 { margin:0; font-size:22px; font-weight:600; }
p { margin:0; color:var(--muted); }
label { display:grid; gap:6px; font-weight:500; }
input { font:inherit; padding:10px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--bg); color:var(--ink); }
button { font:inherit; font-weight:600; padding:10px 14px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.err { color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Your Month Recap</h1>
  <p>A team demo of the monthly trade recap. Enter the team password to continue.</p>
  <p class="err" id="err" hidden></p>
  <form method="post" action="/login">
    <label>Password <input type="password" name="password" id="password" autocomplete="current-password" required autofocus></label>
    <p style="margin-top:16px"><button type="submit">Sign in</button></p>
  </form>
</main>
<script>
const e = new URLSearchParams(location.search).get("e");
if (e) {
  const el = document.getElementById("err");
  el.textContent = e === "setup" ? "The site password has not been set up yet." : "That password didn't match. Try again.";
  el.hidden = false;
}
</script>
</body>
</html>
