<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Month Recap · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap">
<style>
:root { --bg:#FFF6F3; --card:#FFFFFF; --ink:#1E0B08; --muted:#6E5F5B; --rule:#EADBD6; --accent:#D42A1F; --accent-ink:#FFFFFF; --warn:#8A5A00;
  --font:"Manrope",system-ui,sans-serif; --display:"Space Grotesk","Manrope",system-ui,sans-serif; color-scheme:light; }  /* Stox, light */
@media (prefers-color-scheme: dark) {  /* Stox, dark: the brand file's own look */
  :root { --bg:#110706; --card:#1F0F0C; --ink:#FFF3F0; --muted:#A59997; --rule:#2E2322; --accent:#FF3B30; --accent-ink:#190A08; --warn:#FAC94F; color-scheme:dark; }
  .logo.on-light { display:none; } .logo.on-dark { display:block; }
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font); padding:16px; }
main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:28px; display:grid; gap:16px; }
h1 { margin:0; font-family:var(--display); font-size:22px; font-weight:700; }
.logo { height:24px; width:auto; }
.logo.on-light { display:block; } .logo.on-dark { display:none; }
p { margin:0; color:var(--muted); }
label { display:grid; gap:6px; font-weight:500; }
input { font:inherit; padding:10px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--bg); color:var(--ink); }
button { font:inherit; font-weight:700; padding:10px 18px; border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.err { color:var(--warn); }
</style>
</head>
<body>
<main>
  <img class="logo on-light" src="/stox-logo-light.png" alt="stox.com" width="140" height="24">
  <img class="logo on-dark" src="/stox-logo.png" alt="stox.com" width="140" height="24">
  <h1>Your Month Recap</h1>
  <p>A team demo of the monthly trade recap. Enter the team password to continue.</p>
  <p class="err" id="err" hidden></p>
  <form method="post" action="/login">
    <label>Password <input type="password" name="password" id="password" autocomplete="current-password" required autofocus></label>
    <p style="margin-top:16px"><button type="submit">Sign in</button></p>
  </form>
</main>
<script>
const e = new URLSearchParams(location.search).get("e");
if (e) {
  const el = document.getElementById("err");
  el.textContent = e === "setup" ? "The site password has not been set up yet." : "That password didn't match. Try again.";
  el.hidden = false;
}
</script>
</body>
</html>
