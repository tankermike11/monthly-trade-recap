# Persona 6: Same-day SPX
id: p06
first_name: Alex
time_zone: America/Chicago
style: same_day_index

account:
  starting_value: 25000
  options_level: 3
  futures: no
  crypto: no

summary: >
  Trades the S&P 500 index itself with small spreads that end the same day,
  or sometimes the next day. Checks every 15 minutes and closes once most of
  the possible gain shows up, usually waiting for a fair middle price
  rather than taking the first one offered; about one trade in three is left alone until
  it ends and settles in cash. One to three trades a day, one at a time.

index: SPX
trades_per_day: {from: 1, to: 3}
next_day_share: 0.3          # about 3 in 10 trades end the next trading day
sides: {put_credit_spread: 0.6, call_credit_spread: 0.4}
short_leg: 0.10              # delta of the sold option
width_points: [5, 10]        # distance between the two strikes
contracts: {from: 1, to: 2}

take_profit_at: 80%
winners_closed_at_mid_price: 0.8   # share of winners closed with a patient order at the mid price
lets_it_run_share: 0.35      # about 1 in 3 trades is left alone until it ends
stop_loss_at: 200%           # close if it has lost twice the cash collected
check_every_minutes: 15
trading_hours: "09:00-11:30" # Central time, first trade of the day
last_new_trade: "13:30"      # Central time (earlier on half days)
