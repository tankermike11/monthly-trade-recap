  SPY:  {kind: etf, start: 680, vol: 0.15, iv: 0.18, step: 1, liquid: yes, yield: 0.012}
  QQQ:  {kind: etf, start: 600, vol: 0.19, iv: 0.23, step: 1, liquid: yes, yield: 0.006}
