# Persona 2: Stock day trader
id: p02
first_name: Sam
time_zone: America/New_York
style: day_trader

account:
  starting_value: 40000
  options_level: 0
  futures: no
  crypto: no

summary: >
  Buys and sells the same shares within the same day, about three times a
  day, in a handful of fast-moving stocks. Some trades start before the
  market opens. Takes a small gain or a small loss quickly and is always
  out of every stock before the close.

symbols: [TSLA, NVDA, AMD, PLTR, SOFI]
round_trips_per_day: {from: 2, to: 4}
dollars_per_trade: 15000         # roughly how much money goes into each trade
short_share: 0.25                # 1 in 4 trades bets on the price falling

pre_market_share: 0.2            # 1 in 5 trades starts before 09:30
pre_market_hours: "07:00-09:00"
regular_hours: "09:45-15:00"

take_profit: 0.4%                # get out after a 0.4% gain
stop_loss: 0.4%                  # or after a 0.4% loss
max_hold_minutes: 90
must_be_flat_by: "15:55"

planted:                         # November edge case: first trading day after clocks change
  - {date: 2026-11-02, pre_market_trades: 2}
