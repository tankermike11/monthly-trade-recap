# Model settings for pipeline/write.py. Stored with every output.
# The current Claude models reject temperature/top_p (sampling is fixed), so the
# repeatable knobs are the model, effort, max_tokens and the prompt version.

model: claude-opus-5-5          # decided 2026-11-02 (SPEC 4.4, RC-2): Opus over Sonnet and Haiku
effort: medium                  # low | medium | high
max_tokens: 4000
prompt_version: recap_v4        # prompts/<version>.md (v4: code writes fact lines, Claude the picture)
fallbacks: default              # server-side refusal fallback; not sent for Haiku (unsupported)

# The claim check (pipeline/claimcheck.py): a second call marks each sentence Claude wrote
# supported or not against the trades; an unsupported sentence gets one rewrite, then review.
# Chosen 2026-11-04 on evals/claims.jsonl (scripts/eval_claimcheck.py): Opus 5.5 at medium
# caught 11 of 12 known-bad sentences and held back none of 21 correct recaps; Haiku 10/12
# with 2 of 21 held; Sonnet 10/12 with 14 of 21 held.
claim_check:
  model: claude-opus-5-5
  effort: medium

# $ per million tokens, for the cost line in the model comparison (cached 2026-10-06)
prices:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01}
